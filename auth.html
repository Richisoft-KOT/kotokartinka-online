<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="windows-1251">
    <title>Авторизация</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: #ccc; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .auth-container { background: #fff; border: 1px solid #000; padding: 20px; display: inline-block; }
        input { display: block; margin: 10px auto; padding: 4px; font-family: arial; }
        button { font-family: arial; font-weight: bold; padding: 3px 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Вход / Регистрация</h2>
    <input type="text" id="credential-login" size="30" placeholder="Логин">
    <input type="password" id="credential-pass" size="30" placeholder="Пароль">
    <br>
    <button id="action-login">ВОЙТИ</button>
    <button id="action-register" style="margin-left: 10px;">ЗАРЕГИСТРИРОВАТЬСЯ</button>
    <br><br>
    <a href="index.html">На главную</a>
</div>

<script>
const DB_ENDPOINT = 'https://supabase.co'; 
const DB_PUBLIC_KEY = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77'; 

const dbConnection = supabase.createClient(DB_ENDPOINT, DB_PUBLIC_KEY);

const elLogin = document.getElementById('credential-login');
const elPass = document.getElementById('credential-pass');

// Обработчик для регистрации нового аккаунта
document.getElementById('action-register').onclick = async function() {
    var strUser = elLogin.value.trim();
    var strPass = elPass.value.trim();
    
    if(!strUser || !strPass) {
        alert("Заполните все обязательные поля (Логин и Пароль).");
        return;
    }

    try {
        const { data: fetchResult, error: fetchError } = await dbConnection
            .from('kotokartinka_users')
            .select('username')
            .eq('username', strUser);

        if (fetchError) throw fetchError;

        if(fetchResult && fetchResult.length > 0) {
            alert("Пользователь с таким именем уже зарегистрирован в системе.");
            return;
        }

        const { error: insertError } = await dbConnection
            .from('kotokartinka_users')
            .insert([{ username: strUser, password: strPass }]);

        if (insertError) throw insertError;

        alert("Регистрация успешно завершена. Вы можете выполнить вход.");

    } catch (err) {
        console.error(err);
        alert("Ошибка работы с базой данных: " + err.message);
    }
};

// Обработчик для авторизации существующего аккаунта
document.getElementById('action-login').onclick = async function() {
    var strUser = elLogin.value.trim();
    var strPass = elPass.value.trim();
    
    if(!strUser || !strPass) {
        alert("Введите логин и пароль для аутентификации.");
        return;
    }

    try {
        const { data: authResult, error: authError } = await dbConnection
            .from('kotokartinka_users')
            .select('*')
            .eq('username', strUser)
            .eq('password', strPass);

        if (authError) throw authError;

        if (authResult && authResult.length > 0) {
            alert("Авторизация выполнена успешно.");
            
            localStorage.setItem('current_cat_user', strUser);
            window.location.href = 'index.html';
        } else {
            alert("Указан неверный логин или пароль.");
        }

    } catch (err) {
        console.error(err);
        alert("Ошибка работы с базой данных: " + err.message);
    }
};
</script>
</body>
</html>
