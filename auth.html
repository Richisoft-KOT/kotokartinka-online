<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="windows-1251">
    <title>Авторизация</title>
    <!-- Подключение через альтернативное зеркало unpkg для обхода таймаута -->
    <script src="https://unpkg.com"></script>
    <style>
        body { background: #ccc; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #fff; border: 1px solid #000; padding: 20px; display: inline-block; }
        input { display: block; margin: 10px auto; padding: 4px; font-family: arial; }
        button { font-family: arial; font-weight: bold; padding: 3px 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Вход / Регистрация</h2>
    <input type="text" id="u-login" size="30" placeholder="Логин">
    <input type="password" id="u-pass" size="30" placeholder="Пароль">
    <br>
    <button id="b-enter">ВОЙТИ</button>
    <button id="b-reg" style="margin-left: 10px;">ЗАРЕГИСТРИРОВАТЬСЯ</button>
    <br><br>
    <a href="index.html">На главную</a>
</div>

<script>
// Параметры подключения к вашему проекту
const host = 'https://supabase.co'; 
const key = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77'; 

// Создание экземпляра клиента
const client = supabase.createClient(host, key);

const inputL = document.getElementById('u-login');
const inputP = document.getElementById('u-pass');

// Логика кнопки регистрации
document.getElementById('b-reg').onclick = async function() {
    var l = inputL.value.trim();
    var p = inputP.value.trim();
    if(!l || !p) return alert("Заполните все поля.");

    try {
        const { data: rows, error: e1 } = await client
            .from('kotokartinka_users')
            .select('username')
            .eq('username', l);

        if (e1) throw e1;
        if (rows && rows.length > 0) return alert("Пользователь уже существует.");

        const { error: e2 } = await client
            .from('kotokartinka_users')
            .insert([{ username: l, password: p }]);

        if (e2) throw e2;
        alert("Регистрация завершена.");
    } catch (err) {
        alert("Ошибка: " + err.message);
    }
};

// Логика кнопки входа
document.getElementById('b-enter').onclick = async function() {
    var l = inputL.value.trim();
    var p = inputP.value.trim();
    if(!l || !p) return alert("Введите данные.");

    try {
        const { data: rows, error: e3 } = await client
            .from('kotokartinka_users')
            .select('*')
            .eq('username', l)
            .eq('password', p);

        if (e3) throw e3;

        if (rows && rows.length > 0) {
            alert("Вход выполнен.");
            localStorage.setItem('current_cat_user', l);
            window.location.href = 'index.html';
        } else {
            alert("Неверный логин или пароль.");
        }
    } catch (err) {
        alert("Ошибка: " + err.message);
    }
};
</script>
</body>
</html>
