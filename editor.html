<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: Создать мем</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #fff2e3;
      color: #333;
    }
    h1 {
      color: #d35400;
      text-align: center;
    }
    .editor-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }
    /* Панель управления */
    .controls {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }
    .control-group {
      margin-bottom: 15px;
    }
    .control-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .control-group input[type="text"], 
    .control-group input[type="file"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    /* Кнопки */
    .btn {
      display: inline-block;
      background-color: #ff9900;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }
    .btn:hover {
      background-color: #e68a00;
    }
    /* Область предпросмотра */
    .preview-box {
      position: relative;
      max-width: 500px;
      width: 100%;
      border: 5px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      background: #ddd;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .preview-box img {
      width: 100%;
      display: block;
    }
    .preview-box .caption-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    /* Скрытый холст для генерации */
    #canvas-helper {
      display: none;
    }
    .nav-links {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Генератор КОТОКАРТИНКИ</h1>

  <div class="editor-container">
    
    <!-- Настройки мема -->
    <div class="controls">
      <div class="control-group">
        <label for="image-input">1. Выберите картинку кота:</label>
        <input type="file" id="image-input" accept="image/*">
      </div>
      
      <div class="control-group">
        <label for="text-input">2. Текст подписи (Shift+Enter для новой строки):</label>
        <input type="text" id="text-input" placeholder="Человек, я всё уронил..." value="Человек, я всё уронил...">
      </div>

      <div class="control-group">
        <label for="alpha-input">3. Прозрачность плашки:</label>
        <input type="range" id="alpha-input" min="0" max="1" step="0.1" value="0.6">
      </div>

      <button id="download-btn" class="btn" style="width: 100%;">Скачать Готовую Котокартинку</button>
    </div>

    <!-- Интерактивный предпросмотр -->
    <div class="preview-box" id="preview-container">
      <span id="placeholder-text" style="color: #666;">Здесь будет ваш мем</span>
      <img id="preview-img" src="" style="display: none;" alt="Превью">
      <div class="caption-layer" id="preview-caption" style="display: none;"></div>
    </div>

  </div>

  <!-- Технический элемент для сборки картинки -->
  <canvas id="canvas-helper"></canvas>

  <div class="nav-links">
    <a href="index.html" style="color: #333;">Вернуться на главную</a>
  </div>

  <script>
    const imageInput = document.getElementById('image-input');
    const textInput = document.getElementById('text-input');
    const alphaInput = document.getElementById('alpha-input');
    const previewImg = document.getElementById('preview-img');
    const previewCaption = document.getElementById('preview-caption');
    const placeholderText = document.getElementById('placeholder-text');
    const downloadBtn = document.getElementById('download-btn');
    const canvas = document.getElementById('canvas-helper');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;

    // 1. Обработка загрузки файла
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          placeholderText.style.display = 'none';
          previewCaption.style.display = 'block';
          updatePreview();
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 2. Обновление текста и прозрачности «на лету»
    function updatePreview() {
      previewCaption.textContent = textInput.value;
      previewCaption.style.background = `rgba(0, 0, 0, ${alphaInput.value})`;
    }

    textInput.addEventListener('input', updatePreview);
    alphaInput.addEventListener('input', updatePreview);

    // Initial setup
    updatePreview();

    // 3. Сборка картинки на Canvas и скачивание
    downloadBtn.addEventListener('click', function() {
      if (!loadedImage) {
        alert('Сначала загрузите картинку котика!');
        return;
      }

      // Устанавливаем оригинальный размер холста как у картинки
      canvas.width = loadedImage.naturalWidth;
      canvas.height = loadedImage.naturalHeight;

      // Рисуем кота
      ctx.drawImage(loadedImage, 0, 0);

      // Рассчитываем параметры плашки относительно размера картинки
      const text = textInput.value;
      const lines = text.split('\n');
      
      // Адаптивный размер шрифта (примерно 4.5% от ширины картинки)
      const fontSize = Math.max(16, Math.floor(canvas.width * 0.045)); 
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';

      const padding = fontSize * 0.8;
      const lineHeight = fontSize * 1.3;
      const rectHeight = (lines.length * lineHeight) + (padding * 2);
      const rectY = canvas.height - rectHeight;

      // Рисуем полупрозрачную плашку
      ctx.fillStyle = `rgba(0, 0, 0, ${alphaInput.value})`;
      ctx.fillRect(0, rectY, canvas.width, rectHeight);

      // Рисуем текст с тенью
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;

      lines.forEach((line, index) => {
        const textY = rectY + padding + fontSize + (index * lineHeight);
        ctx.fillText(line, canvas.width / 2, textY);
      });

      // Скачивание файла
      const link = document.createElement('a');
      link.download = 'kotokartinka.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
