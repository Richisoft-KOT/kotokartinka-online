<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: редактор</title>
  <style>
    html { 
      background: url('https://github.com/user-attachments/assets/3d317e0d-8cee-44b5-baed-0012191ebc75') no-repeat center center / cover fixed; 
      }
    .oldschool-text {
      font-family: Arial, sans-serif;
      font-weight: normal;
      white-space: nowrap;
      -webkit-text-stroke: 1px black;
      text-shadow: 1px 1px 0 #000;
    }
  </style>
</head>

<a href="/">На главную</a><br><br>

  <table border="0" cellpadding="3" cellspacing="0">
    <tr>
      <td align="right"><font face="arial" size="2">Текст:</font></td>
      <td>
        <input type="text" id="text-input" size="80" value="введи здесь текст">
      </td>
      <td rowspan="4" valign="top" style="padding-left: 20px;">
        <font face="arial" size="2">Уже нанесенные надписи:</font><br>
        <select id="added-texts-list" size="5" style="width: 250px; font-family: arial; font-size: 12px;">
        </select>
        <br>
        <button id="clear-last-btn" style="font-family: arial; font-size: 11px; margin-top: 4px;">удалить последнюю</button>
      </td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Размер:</font></td>
      <td>
        <select id="font-size-select" style="font-family: arial;">
          <option value="14">14</option>
          <option value="16">16</option>
          <option value="18">18</option>
          <option value="20" selected>20</option>
          <option value="24">24</option>
          <option value="28">28</option>
          <option value="32">32</option>
          <option value="36">36</option>
          <option value="40">40</option>
        </select>
      </td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Цвет:</font></td>
      <td>
        <select id="text-color-select" style="font-family: arial;">
          <option value="#ffffff" selected>Белый</option>
          <option value="#000000">Черный</option>
          <option value="#ff0000">Красный</option>
          <option value="#808080">Серый</option>
          <option value="#ffff00">Желтый</option>
          <option value="#008000">Темно-зеленый</option>
          <option value="#800000">Бордовый</option>
          <option value="#000080">Темно-синий</option>
        </select>
      </td>
    </tr>
    <tr>
      <td></td>
      <td>
        <input type="file" id="image-input" accept="image/*" style="font-family: arial; font-size: 12px;">
      </td>
    </tr>
  </table>

  <br>
  <button id="download-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
    СКАЧАТЬ ТВОРЕНИЕ!
  </button>
  
  <!-- ПРОСТАЯ ПЛАШКА БЕЗ СТИЛЕЙ -->
  <div id="openvk-box" style="display: none; margin-top: 15px;">
    <font face="arial" size="2">Текст для OpenVK:</font><br>
    <input type="text" id="openvk-text-output" size="90" readonly>
    <button id="copy-text-btn">Скопировать текст</button>
  </div>
  
  <br><br>

  <div id="preview-area" style="position: relative; display: inline-block; border: 1px solid #000000; cursor: crosshair; min-width: 320px; min-height: 240px; background-color: #ccc;">
    <span id="placeholder-text" style="font-family: arial; font-size: 13px; padding: 10px; display: block;">[ сначала выбери картинку ]</span>
    <img id="preview-img" src="" style="display: none; max-width: 750px; height: auto;" draggable="false">
    
    <div id="preview-floating-caption" class="oldschool-text" style="position: absolute; left: 0; top: 0; pointer-events: none; display: none;"></div>
    <div id="fixed-captions-layer" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden;"></div>

    <div id="preview-watermark" class="oldschool-text" style="position: absolute; left: 15px; bottom: 15px; pointer-events: none; color: #ffffff; display: none; font-size: 13px;">
      kotokartinka.is-cool.dev
    </div>
  </div>

  <canvas id="canvas-helper" style="display: none;"></canvas>

  <script>
    var imageInput = document.getElementById('image-input');
    var textInput = document.getElementById('text-input');
    var textColorSelect = document.getElementById('text-color-select');
    var fontSizeSelect = document.getElementById('font-size-select');
    var addedTextsList = document.getElementById('added-texts-list');
    var clearLastBtn = document.getElementById('clear-last-btn');
    
    var previewArea = document.getElementById('preview-area');
    var previewImg = document.getElementById('preview-img');
    var floatingCaption = document.getElementById('preview-floating-caption');
    var fixedCaptionsLayer = document.getElementById('fixed-captions-layer');
    var previewWatermark = document.getElementById('preview-watermark');
    var placeholderText = document.getElementById('placeholder-text');
    var downloadBtn = document.getElementById('download-btn');
    var canvas = document.getElementById('canvas-helper');
    var ctx = canvas.getContext('2d');

    // Переменные для текста OpenVK
    var openvkBox = document.getElementById('openvk-box');
    var openvkTextOutput = document.getElementById('openvk-text-output');
    var copyTextBtn = document.getElementById('copy-text-btn');

    var loadedImage = null;
    var savedCaptions = []; 
    var currentXPercent = 10;
    var currentYPercent = 10;

    imageInput.onchange = function(e) {
      if (!e.target.files || e.target.files.length === 0) return;
      
      var file = e.target.files[0];
      var reader = new FileReader();
      
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          placeholderText.style.display = 'none';
          floatingCaption.style.display = 'block';
          previewWatermark.style.display = 'block';
          savedCaptions = []; 
          renderAllFixedCaptions();
          updateFloatingStyles();
          openvkBox.style.display = 'none'; // Скрываем при выборе новой картинки
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    function updateFloatingStyles() {
      floatingCaption.innerText = textInput.value;
      floatingCaption.style.color = textColorSelect.value;
      floatingCaption.style.fontSize = fontSizeSelect.value + 'px';
    }

    previewArea.onmousemove = function(e) {
      if (!loadedImage) return;
      var rect = previewArea.getBoundingClientRect();
      currentXPercent = ((e.clientX - rect.left) / rect.width) * 100;
      currentYPercent = ((e.clientY - rect.top) / rect.height) * 100;
      floatingCaption.style.left = currentXPercent + '%';
      floatingCaption.style.top = currentYPercent + '%';
    };

    previewArea.onclick = function(e) {
      if (!loadedImage) return;
      if (e.target === addedTextsList) return;
      if (e.target === clearLastBtn) return;
      if (e.target.tagName === 'SELECT') return;

      var newCaption = {
        text: textInput.value,
        color: textColorSelect.value,
        size: parseInt(fontSizeSelect.value),
        xPct: currentXPercent,
        yPct: currentYPercent
      };
      savedCaptions.push(newCaption);
      renderAllFixedCaptions();
    };

    function renderAllFixedCaptions() {
      fixedCaptionsLayer.innerHTML = '';
      addedTextsList.innerHTML = '';
      savedCaptions.forEach(function(cap, idx) {
        var div = document.createElement('div');
        div.innerText = cap.text;
        div.className = 'oldschool-text';
        div.style.position = 'absolute';
        div.style.left = cap.xPct + '%';
        div.style.top = cap.yPct + '%';
        div.style.color = cap.color;
        div.style.fontSize = cap.size + 'px';
        fixedCaptionsLayer.appendChild(div);

        var opt = document.createElement('option');
        opt.text = (idx + 1) + '. ' + cap.text.substring(0, 15);
        addedTextsList.add(opt);
      });
    }

    clearLastBtn.onclick = function(e) {
      e.stopPropagation(); 
      if (savedCaptions.length > 0) {
        savedCaptions.pop();
        renderAllFixedCaptions();
      }
    };

    textInput.oninput = updateFloatingStyles;
    textColorSelect.onchange = updateFloatingStyles;
    fontSizeSelect.onchange = updateFloatingStyles;

    // Сбор текста и показ строки при клике на скачивание
    downloadBtn.onclick = function() {
      if (!loadedImage) return;
      
      // Склеиваем все надписи, которые добавлены на картинку
      var allTexts = savedCaptions.map(function(cap) { return cap.text; }).join(' ');
      
      // Если на картинку ничего не прикрепили, берём то, что введено в поле прямо сейчас
      if (allTexts.trim() === "" && textInput.value.trim() !== "") {
        allTexts = textInput.value;
      }

      // Генерируем строку строго по правилу №8
      var openvkFormattedText = "[" + allTexts + "]. еще больше мемов: котокартинка - https://openvk.org";
      
      // Выводим в поле и показываем блок
      openvkTextOutput.value = openvkFormattedText;
      openvkBox.style.display = 'block';
    };

    // Простое копирование текста в буфер обмена
    copyTextBtn.onclick = function() {
      openvkTextOutput.select();
      openvkTextOutput.setSelectionRange(0, 99999);
      document.execCommand("copy");
    };
  </script>
</body>
</html>
