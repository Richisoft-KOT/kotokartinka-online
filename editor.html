<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: Конструктор мемов</title>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">

  <font face="arial" size="5"><b>ГЕНЕРАТОР КОТОКАРТИНКИ (БЕТА)</b></font>
  <br><br>

  <!-- Ссылка назад -->
  <a href="index.html">&lt;&lt; Вернуться на главную страницу</a>
  <br><br>

  <!-- Панель управления (простая HTML таблица для структуры в старом стиле) -->
  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td>
        <b>1. Загрузи кота:</b><br>
        <input type="file" id="image-input" accept="image/*">
      </td>
    </tr>
    <tr>
      <td>
        <b>2. Напиши текст подписи:</b><br>
        <input type="text" id="text-input" size="50" value="Человек, я всё уронил. Иди поднимай.">
      </td>
    </tr>
    <tr>
      <td>
        <b>3. Прозрачность черной плашки (от 0 до 100):</b><br>
        <input type="range" id="alpha-input" min="0" max="1" step="0.1" value="0.6">
      </td>
    </tr>
    <tr>
      <td>
        <!-- Большая стандартная кнопка -->
        <button id="download-btn" style="font-size: 16px; font-weight: bold; padding: 5px 10px;">
          СКАЧАТЬ ГОТОВУЮ КОТОКАРТИНКУ!
        </button>
      </td>
    </tr>
  </table>

  <br>
  <font face="arial" size="4"><b>Предпросмотр:</b></font>
  <br><br>

  <!-- Блок предпросмотра (просто картинка и текст под ней, позиционирование через JS на Canvas) -->
  <div id="preview-area" style="position: relative; display: inline-block; border: 4px solid #ffffff;">
    <span id="placeholder-text">[ Здесь будет картинка, когда ты её выберешь ]</span>
    <img id="preview-img" src="" style="display: none; max-width: 600px; height: auto;">
    
    <!-- Абсолютно позиционированная сырая плашка -->
    <div id="preview-caption" style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #ffffff; font-family: arial; font-weight: bold; font-size: 20px; padding: 10px; text-align: center; display: none;"></div>
  </div>

  <!-- Технический холст, скрыт от глаз -->
  <canvas id="canvas-helper" style="display: none;"></canvas>

  <br><br>
  <hr align="left" width="600">
  <font face="arial" size="2">СДЕЛАННО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год</font>

  <!-- Простой скрипт обработки без лишних наворотов -->
  <script>
    const imageInput = document.getElementById('image-input');
    const textInput = document.getElementById('text-input');
    const alphaInput = document.getElementById('alpha-input');
    const previewImg = document.getElementById('preview-img');
    const previewCaption = document.getElementById('preview-caption');
    const placeholderText = document.getElementById('placeholder-text');
    const downloadBtn = document.getElementById('download-btn');
    const canvas = document.getElementById('canvas-helper');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;

    // Чтение картинки
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          placeholderText.style.display = 'none';
          previewCaption.style.display = 'block';
          updatePreview();
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Изменение текста на лету
    function updatePreview() {
      previewCaption.innerText = textInput.value;
      previewCaption.style.background = `rgba(0, 0, 0, ${alphaInput.value})`;
    }

    textInput.addEventListener('input', updatePreview);
    alphaInput.addEventListener('input', updatePreview);

    // Сборка и скачивание
    downloadBtn.addEventListener('click', function() {
      if (!loadedImage) {
        alert('Эй! Картинку-то выбери сначала!');
        return;
      }

      canvas.width = loadedImage.naturalWidth;
      canvas.height = loadedImage.naturalHeight;

      // Рисуем кота
      ctx.drawImage(loadedImage, 0, 0);

      // Настройки шрифта под размер картинки
      const text = textInput.value;
      const fontSize = Math.max(16, Math.floor(canvas.width * 0.045));
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';

      // Считаем высоту плашки
      const padding = fontSize * 0.8;
      const rectHeight = fontSize + (padding * 2);
      const rectY = canvas.height - rectHeight;

      // Плашка
      ctx.fillStyle = `rgba(0, 0, 0, ${alphaInput.value})`;
      ctx.fillRect(0, rectY, canvas.width, rectHeight);

      // Белый текст с тенью
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'black';
      ctx.shadowBlur = 4;
      ctx.fillText(text, canvas.width / 2, rectY + padding + (fontSize * 0.8));

      // Скачивание
      const link = document.createElement('a');
      link.download = 'kotokartinka.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
