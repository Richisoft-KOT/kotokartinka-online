<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: Конструктор мемов</title>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">

  <font face="arial" size="5"><b>ГЕНЕРАТОР КОТОКАРТИНКИ (ВЕРСИЯ 2.0-БЕТА)</b></font>
  <br><br>

  <a href="index.html">&lt;&lt; Вернуться на главную страницу</a>
  <br><br>

  <!-- Таблица настроек из 2000-х -->
  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td>
        <b>1. Загрузи кота:</b><br>
        <input type="file" id="image-input" accept="image/*">
      </td>
    </tr>
    <tr>
      <td>
        <b>2. Текст подписи:</b><br>
        <input type="text" id="text-input" size="50" value="Человек, я всё уронил. Иди поднимай.">
      </td>
    </tr>
    <tr>
      <td>
        <b>3. Положение текста (по вертикали):</b><br>
        <button id="move-up-btn">↑ Выше</button>
        <button id="move-down-btn">↓ Ниже</button>
      </td>
    </tr>
    <tr>
      <td>
        <b>4. Цвет плашки:</b><br>
        <select id="bg-color-select">
          <option value="rgba(0,0,0,0.6)" selected>Черный (полупрозрачный)</option>
          <option value="black">Черный (плотный)</option>
          <option value="blue">Синий</option>
          <option value="red">Красный</option>
          <option value="green">Зеленый</option>
          <option value="white">Белый</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <b>5. Цвет текста:</b><br>
        <select id="text-color-select">
          <option value="white" selected>Белый</option>
          <option value="yellow">Желтый</option>
          <option value="black">Черный</option>
          <option value="red">Красный</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <b>6. Размер шрифта:</b><br>
        <select id="font-size-select">
          <option value="small">Маленький</option>
          <option value="medium" selected>Обычный</option>
          <option value="large">Большой</option>
          <option value="huge">Огромный</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <button id="download-btn" style="font-size: 16px; font-weight: bold; padding: 5px 10px;">
          СКАЧАТЬ ГОТОВУЮ КОТОКАРТИНКУ!
        </button>
      </td>
    </tr>
  </table>

  <br>
  <font face="arial" size="4"><b>Предпросмотр:</b></font>
  <br><br>

  <!-- Область предпросмотра -->
  <div id="preview-area" style="position: relative; display: inline-block; border: 4px solid #ffffff;">
    <span id="placeholder-text">[ Картинка появится здесь ]</span>
    <img id="preview-img" src="" style="display: none; max-width: 600px; height: auto;">
    
    <!-- Перемещаемая плашка -->
    <div id="preview-caption" style="position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; text-align: center; font-family: arial; font-weight: bold; display: none;"></div>
  </div>

  <canvas id="canvas-helper" style="display: none;"></canvas>

  <br><br>
  <hr align="left" width="600">
  <font face="arial" size="2">СДЕЛАННО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год</font>

  <script>
    const imageInput = document.getElementById('image-input');
    const textInput = document.getElementById('text-input');
    const bgColorSelect = document.getElementById('bg-color-select');
    const textColorSelect = document.getElementById('text-color-select');
    const fontSizeSelect = document.getElementById('font-size-select');
    const moveUpBtn = document.getElementById('move-up-btn');
    const moveDownBtn = document.getElementById('move-down-btn');
    
    const previewImg = document.getElementById('preview-img');
    const previewCaption = document.getElementById('preview-caption');
    const placeholderText = document.getElementById('placeholder-text');
    const downloadBtn = document.getElementById('download-btn');
    const canvas = document.getElementById('canvas-helper');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;
    let captionBottomPercent = 0; // Смещение снизу в процентах (0 = самый низ)

    // Загрузка картинки
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          placeholderText.style.display = 'none';
          previewCaption.style.display = 'block';
          captionBottomPercent = 0; // Сброс позиции
          updatePreview();
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Функция обновления превью
    function updatePreview() {
      previewCaption.innerText = textInput.value;
      previewCaption.style.background = bgColorSelect.value;
      previewCaption.style.color = textColorSelect.value;
      
      // Сдвиг плашки в превью
      previewCaption.style.bottom = captionBottomPercent + '%';

      // Размер шрифта в превью
      if (fontSizeSelect.value === 'small') previewCaption.style.font_size = '14px';
      if (fontSizeSelect.value === 'medium') previewCaption.style.fontSize = '20px';
      if (fontSizeSelect.value === 'large') previewCaption.style.fontSize = '28px';
      if (fontSizeSelect.value === 'huge') previewCaption.style.fontSize = '36px';
    }

    // Обработчики кнопок движения
    moveUpBtn.addEventListener('click', function() {
      if (captionBottomPercent < 85) {
        captionBottomPercent += 5;
        updatePreview();
      }
    });

    moveDownBtn.addEventListener('click', function() {
      if (captionBottomPercent > 0) {
        captionBottomPercent -= 5;
        updatePreview();
      }
    });

    // Слушатели изменений
    textInput.addEventListener('input', updatePreview);
    bgColorSelect.addEventListener('change', updatePreview);
    textColorSelect.addEventListener('change', updatePreview);
    fontSizeSelect.addEventListener('change', updatePreview);

    // Сборка финального файла
    downloadBtn.addEventListener('click', function() {
      if (!loadedImage) {
        alert('Картинку выбери сначала!');
        return;
      }

      canvas.width = loadedImage.naturalWidth;
      canvas.height = loadedImage.naturalHeight;

      // Рисуем кота
      ctx.drawImage(loadedImage, 0, 0);

      // Масштабирование шрифта под реальное разрешение картинки
      let baseSize = canvas.width * 0.045;
      if (fontSizeSelect.value === 'small') baseSize = canvas.width * 0.03;
      if (fontSizeSelect.value === 'large') baseSize = canvas.width * 0.06;
      if (fontSizeSelect.value === 'huge') baseSize = canvas.width * 0.08;

      const fontSize = Math.max(12, Math.floor(baseSize));
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';

      // Считаем высоту плашки
      const padding = fontSize * 0.6;
      const rectHeight = fontSize + (padding * 2);
      
      // Вычисляем координату Y плашки на основе процентов смещения
      const maxScrollArea = canvas.height - rectHeight;
      const currentOffset = (captionBottomPercent / 100) * canvas.height;
      let rectY = canvas.height - rectHeight - currentOffset;
      
      // Ограничители, чтобы не вылетало за границы картинки
      if (rectY < 0) rectY = 0;
      if (rectY > maxScrollArea) rectY = maxScrollArea;

      // Рисуем плашку выбранного цвета
      ctx.fillStyle = bgColorSelect.value;
      ctx.fillRect(0, rectY, canvas.width, rectHeight);

      // Настройка тени (для светлых шрифтов)
      if (textColorSelect.value !== 'black') {
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
      } else {
        ctx.shadowColor = 'transparent';
      }

      // Печатаем текст выбранного цвета
      ctx.fillStyle = textColorSelect.value;
      ctx.fillText(textInput.value, canvas.width / 2, rectY + padding + (fontSize * 0.8));

      // Скачивание png
      const link = document.createElement('a');
      link.download = 'kotokartinka.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
