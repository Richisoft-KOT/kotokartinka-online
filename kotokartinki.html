<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: просмотр</title>
  <style>
    body {
      font-family: arial;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #fff2e3;
      color: #333
    }
    img {
      display: block;
      margin: 20px 0;
    }
    .admin-del-btn {
      background: #ff0000; color: #fff; border: 1px solid #000;
      font-family: arial; font-size: 11px; font-weight: bold;
      cursor: pointer; padding: 2px 5px; margin-top: 5px;
    }
  </style>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">

<a href="/index.html">На главную</a> | <a href="/editor.html">Создать котокартинку</a><br><br>

  <!-- Блок для неавторизованных пользователей (Гостей) -->
  <div id="guest-alert-block" style="display: none; border: 1px dashed #ff0000; padding: 10px; background-color: #fff; font-family: arial; font-size: 13px; text-align: center;">
    <font color="red"><b>Чтобы добавлять котокартинки в список, пожалуйста, <a href="/login.html">ВОЙДИТЕ</a> или <a href="/register.html">ЗАРЕГИСТРИРУЙТЕСЬ</a>!</b></font>
  </div>

  <!-- Форма загрузки (Доступна ТОЛЬКО авторизованным) -->
  <table id="upload-form-table" border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff" style="display: none;">
    <tr>
      <td bgcolor="#ff9900" colspan="2"><font face="arial" size="3" color="#ffffff"><b>Добавить котокартинку в список</b></font></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Вы вошли как:</font></td>
      <td>
        <!-- Текстового поля больше НЕТ. Логин выводится жестко без возможности изменения -->
        <b id="author-secure-label" style="font-family: arial; font-size: 14px;">Загрузка профиля...</b>
      </td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Текст с картинки:</font></td>
      <td><input type="text" id="manual-text" size="60" placeholder="Введите все надписи, которые есть на картинке"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Выбрать файл:</font></td>
      <td><input type="file" id="manual-file" accept="image/*"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="manual-publish-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ДОБАВИТЬ В СПИСОК!
        </button>
      </td>
    </tr>
  </table>

  <br><br>

  <!-- Контейнер для вывода загруженных постов -->
  <div id="dynamic-posts-container"></div>
  <div id="static-posts"></div>

<br>
СДЕЛАНО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год

  <script>
    var container = document.getElementById('dynamic-posts-container');
    var fileInput = document.getElementById('manual-file');
    var textInput = document.getElementById('manual-text');
    var publishBtn = document.getElementById('manual-publish-btn');
    
    var authorSecureLabel = document.getElementById('author-secure-label');
    var guestAlertBlock = document.getElementById('guest-alert-block');
    var uploadFormTable = document.getElementById('upload-form-table');

    // ЖЕСТКАЯ ПРИВЯЗКА: Вытаскиваем авторизационные токены из сессии аккаунта
    var currentUser = localStorage.getItem('koto_current_user');
    var currentUserId = parseInt(localStorage.getItem('koto_current_id')) || 0;

    var roleTag = '';
    // Системная проверка ролей на клиенте на основе ID аккаунта
    if (currentUserId === 1) {
      roleTag = ' [создатель]';
    } else if (currentUserId === 2) {
      roleTag = ' [тест]';
    }

    // Проверяем статус входа
    if (currentUser && currentUserId) {
      // Пользователь авторизован — открываем форму и блокируем поле имени
      uploadFormTable.style.display = 'table';
      authorSecureLabel.innerText = currentUser + roleTag;
    } else {
      // Пользователь не вошел — блокируем интерфейс, выводим предупреждение
      guestAlertBlock.style.display = 'block';
    }

    // Роль админа на удаление постов выдается строго ID 1 и ID 2
    var isGlobalAdmin = (currentUserId === 1 || currentUserId === 2);

    function renderDynamicFeed() {
      container.innerHTML = '';
      var posts = [];
      try {
        posts = JSON.parse(localStorage.getItem('kotomatrix_posts') || '[]');
      } catch(e) {
        posts = [];
      }

      posts.forEach(function(post, idx) {
        var postDiv = document.createElement('div');
        postDiv.style.marginBottom = '40px';

        var titleNode = document.createElement('div');
        var boldNode = document.createElement('b');
        boldNode.textContent = post.title; 
        titleNode.appendChild(boldNode);
        
        var imgNode = document.createElement('img');
        imgNode.src = post.image;
        imgNode.style.maxWidth = '750px';
        imgNode.style.height = 'auto';
        imgNode.style.border = '1px solid #000';

        postDiv.appendChild(titleNode);
        postDiv.appendChild(imgNode);

        // Кнопка удаления рендерится только под админской сессией (ID 1 или 2)
        if (isGlobalAdmin) {
          var delBtn = document.createElement('button');
          delBtn.className = 'admin-del-btn';
          delBtn.textContent = '[Удалить эту котокартинку]';
          delBtn.onclick = function() {
            if (confirm('Удалить эту котокартинку из ленты?')) {
              posts.splice(idx, 1);
              localStorage.setItem('kotomatrix_posts', JSON.stringify(posts));
              renderDynamicFeed();
            }
          };
          postDiv.appendChild(delBtn);
        }

        postDiv.appendChild(document.createElement('br'));
        var hr = document.createElement('hr');
        hr.setAttribute('align', 'left'); hr.setAttribute('width', '750');
        postDiv.appendChild(hr);

        container.appendChild(postDiv);
      });
    }

    publishBtn.onclick = function(e) {
      if (e) e.preventDefault();

      // Жесткая проверка безопасности перед записью в локальную базу
      if (!currentUser || !currentUserId) {
        alert('Ошибка доступа: Публикация разрешена только авторизованным аккаунтам!');
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Сначала выберите файл картинки!');
        return;
      }

      var userText = textInput.value.trim();
      if (userText === '') {
        alert('Введите текст, нанесенный на картинку!');
        return;
      }

      var file = fileInput.files[0];
      var reader = new FileReader();

      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');

          var MAX_WIDTH = 800;
          var width = img.width;
          var height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // Стабильное сжатие картинки
          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);

          var dateObj = new Date();
          var day = String(dateObj.getDate()).padStart(2, '0');
          var month = String(dateObj.getMonth() + 1).padStart(2, '0');
          var year = dateObj.getFullYear();
          var formattedDate = day + '.' + month + '.' + year;

          // Подпись формируется строго на основе системного имени вошедшего юзера
          var templateTitle = 'Автор: ' + currentUser + roleTag + ', ' + userText + '... ' + formattedDate;

          var newPost = {
            image: compressedBase64,
            title: templateTitle
          };

          var currentPosts = [];
          try {
            currentPosts = JSON.parse(localStorage.getItem('kotomatrix_posts') || '[]');
          } catch(e) {
            currentPosts = [];
          }
          
          currentPosts.unshift(newPost);
          
          try {
            localStorage.setItem('kotomatrix_posts', JSON.stringify(currentPosts));
          } catch(e) {
            alert('Хранилище переполнено! Используйте картинку поменьше.');
            return;
          }

          textInput.value = '';
          fileInput.value = '';
          
          renderDynamicFeed();
        };
        img.src = event.target.result;
      };

      reader.readAsDataURL(file);
    };

    renderDynamicFeed();
  </script>
</body>
</html>
