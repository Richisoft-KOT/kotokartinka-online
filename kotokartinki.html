<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: просмотр</title>
  <style>
    body {
      font-family: arial;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #fff2e3;
      color: #333
    }
    img {
      display: block;
      margin: 20px 0;
    }
  </style>
</head>
<body>

<a href="/index.html">На главную</a> | <a href="/editor.html">Создать котокартинку</a><br><br>

  <!-- Форма загрузки -->
  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td bgcolor="#ff9900" colspan="2"><font face="arial" size="3" color="#ffffff"><b>Добавить котокартинку в список</b></font></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Никнейм:</font></td>
      <td><input type="text" id="manual-author" size="30" value="Аноним"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Текст с картинки:</font></td>
      <td><input type="text" id="manual-text" size="60" placeholder="Введите все надписи, которые есть на картинке"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Выбрать файл:</font></td>
      <td><input type="file" id="manual-file" accept="image/*"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="manual-publish-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ДОБАВИТЬ В СПИСОК!
        </button>
      </td>
    </tr>
  </table>

  <br><br>

  <!-- Лента постов из Supabase -->
  <div id="dynamic-posts-container"></div>

  <div id="static-posts"></div>

<br>
СДЕЛАНО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год

  <script>
    var container = document.getElementById('dynamic-posts-container');
    var fileInput = document.getElementById('manual-file');
    var authorInput = document.getElementById('manual-author');
    var textInput = document.getElementById('manual-text');
    var publishBtn = document.getElementById('manual-publish-btn');

    // Твой точный URL и ключ
    var SUPABASE_URL = 'https://supabase.co';
    var SUPABASE_KEY = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77'; 

    if (localStorage.getItem('koto_last_nickname')) {
      authorInput.value = localStorage.getItem('koto_last_nickname');
    }

    function renderDynamicFeed() {
      container.innerHTML = '<font face="arial" size="2">Загрузка ленты...</font>';
      
      fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts?select=*&order=id.desc', {
        method: 'GET',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      })
      .then(function(res) { return res.json(); })
      .then(function(posts) {
        container.innerHTML = '';
        if (!posts || posts.length === 0) {
          container.innerHTML = '<font face="arial" size="3">Пока нет ни одной глобальной котокартинки.</font>';
          return;
        }

        posts.forEach(function(post) {
          var postDiv = document.createElement('div');
          postDiv.style.marginBottom = '40px';

          var titleNode = document.createElement('div');
          var boldNode = document.createElement('b');
          boldNode.textContent = post.text; 
          titleNode.appendChild(boldNode);
          
          var imgNode = document.createElement('img');
          imgNode.src = post.image;
          imgNode.style.maxWidth = '750px';
          imgNode.style.height = 'auto';
          imgNode.style.border = '1px solid #000';

          postDiv.appendChild(titleNode);
          postDiv.appendChild(imgNode);
          postDiv.appendChild(document.createElement('br'));
          
          var hr = document.createElement('hr');
          hr.setAttribute('align', 'left');
          hr.setAttribute('width', '750');
          postDiv.appendChild(hr);

          container.appendChild(postDiv);
        });
      })
      .catch(function(err) {
        container.innerHTML = '<font color="red">Ошибка загрузки ленты. Проверь настройки таблицы.</font>';
      });
    }

    publishBtn.onclick = function() {
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Сначала выберите файл картинки!');
        return;
      }

      var nickname = authorInput.value.trim();
      var userText = textInput.value.trim();

      if (nickname === '' || userText === '') {
        alert('Заполните никнейм и текст!');
        return;
      }

      localStorage.setItem('koto_last_nickname', nickname);
      publishBtn.disabled = true;
      publishBtn.innerText = 'ОТПРАВКА...';

      var file = fileInput.files[0];
      var reader = new FileReader();

      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');

          var MAX_WIDTH = 800;
          var width = img.width;
          var height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // Сжатие до 60% для беспрепятственной отправки текстовых строк в Supabase
          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.60);

          var dateObj = new Date();
          var day = String(dateObj.getDate()).padStart(2, '0');
          var month = String(dateObj.getMonth() + 1).padStart(2, '0');
          var year = dateObj.getFullYear();
          var formattedDate = day + '.' + month + '.' + year;

          var templateTitle = 'Автор: ' + nickname + ', ' + userText + '... ' + formattedDate;

          fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts', {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              text: templateTitle, 
              image: compressedBase64
            })
          })
          .then(function(res) {
            if (!res.ok) {
              throw new Error('Код сервера: ' + res.status);
            }
            alert('Успешно опубликовано на весь мир!');
            textInput.value = '';
            fileInput.value = '';
            publishBtn.disabled = false;
            publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
            renderDynamicFeed();
          })
          .catch(function(err) {
            alert('Ошибка отправки: ' + err.message);
            publishBtn.disabled = false;
            publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    renderDynamicFeed();
  </script>
</body>
</html>
