<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: просмотр</title>
  <style>
    body {
      font-family: arial;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #fff2e3;
      color: #333
    }
    img {
      display: block;
      margin: 20px 0;
    }
    .admin-del-btn {
      background: #ff0000; color: #fff; border: 1px solid #000;
      font-family: arial; font-size: 11px; font-weight: bold;
      cursor: pointer; padding: 2px 5px; margin-top: 5px;
    }
  </style>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">

<a href="/index.html">На главную</a> | <a href="/editor.html">Создать котокартинку</a><br><br>

  <!-- Блок для неавторизованных пользователей -->
  <div id="guest-alert-block" style="display: none; border: 1px dashed #ff0000; padding: 10px; background-color: #fff; font-family: arial; font-size: 13px; text-align: center;">
    <font color="red"><b>Чтобы добавлять котокартинки в список, пожалуйста, <a href="/login.html">ВОЙДИТЕ</a> или <a href="/register.html">ЗАРЕГИСТРИРУЙТЕСЬ</a>!</b></font>
  </div>

  <!-- Форма загрузки (по умолчанию скрыта, открывается только для юзеров) -->
  <table id="upload-form-table" border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff" style="display: none;">
    <tr>
      <td bgcolor="#ff9900" colspan="2"><font face="arial" size="3" color="#ffffff"><b>Добавить котокартинку в список</b></font></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Автор:</font></td>
      <td><b id="author-label">Загрузка...</b></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Текст с картинки:</font></td>
      <td><input type="text" id="manual-text" size="60" placeholder="Введите все надписи, которые есть на картинке"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Выбрать файл:</font></td>
      <td><input type="file" id="manual-file" accept="image/*"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="manual-publish-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ДОБАВИТЬ В СПИСОК!
        </button>
      </td>
    </tr>
  </table>

  <br><br>

  <!-- Лента постов из Supabase -->
  <div id="dynamic-posts-container"></div>

  <div id="static-posts"></div>

<br>
СДЕЛАНО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год

  <script>
    var container = document.getElementById('dynamic-posts-container');
    var fileInput = document.getElementById('manual-file');
    var textInput = document.getElementById('manual-text');
    var publishBtn = document.getElementById('manual-publish-btn');
    var authorLabel = document.getElementById('author-label');
    
    var guestAlertBlock = document.getElementById('guest-alert-block');
    var uploadFormTable = document.getElementById('upload-form-table');

    var SUPABASE_URL = 'https://supabase.co';
    var SUPABASE_KEY = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77'; 

    var currentUser = localStorage.getItem('koto_current_user');
    var currentUserId = parseInt(localStorage.getItem('koto_current_id')) || 0;

    // ЖЕСТКАЯ ПРОВЕРКА: Авторизован ли аккаунт?
    if (currentUser && currentUserId) {
      // Пользователь зарегистрирован — показываем форму
      uploadFormTable.style.display = 'table';
      
      var roleTag = '';
      if (currentUserId === 1) roleTag = ' [создатель]';
      if (currentUserId === 2) roleTag = ' [тест]';
      authorLabel.innerText = currentUser + roleTag;
    } else {
      // Пользователь — Гость. Прячем форму, показываем предупреждение
      guestAlertBlock.style.display = 'block';
    }

    // Роль админа на удаление только у ID 1 и ID 2
    var isGlobalAdmin = (currentUserId === 1 || currentUserId === 2);

    function renderDynamicFeed() {
      container.innerHTML = '<font face="arial" size="2">Загрузка ленты...</font>';
      
      fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts?select=*&order=id.desc', {
        method: 'GET',
        headers: { 
          'apikey': SUPABASE_KEY, 
          'Authorization': 'Bearer ' + SUPABASE_KEY, 
          'Content-Type': 'application/json' 
        }
      })
      .then(function(res) { return res.json(); })
      .then(function(posts) {
        container.innerHTML = '';
        if (!posts || posts.length === 0) {
          container.innerHTML = '<font face="arial" size="3">Пока нет ни одной глобальной котокартинки. Будь первым!</font>';
          return;
        }

        posts.forEach(function(post) {
          var postDiv = document.createElement('div');
          postDiv.style.marginBottom = '40px';

          var titleNode = document.createElement('div');
          var boldNode = document.createElement('b');
          boldNode.textContent = post.text; 
          titleNode.appendChild(boldNode);
          
          var imgNode = document.createElement('img');
          imgNode.src = post.image;
          imgNode.style.maxWidth = '750px'; 
          imgNode.style.height = 'auto'; 
          imgNode.style.border = '1px solid #000';

          postDiv.appendChild(titleNode);
          postDiv.appendChild(imgNode);

          // Кнопка удаления видна только создателю (ID 1) и тестеру (ID 2)
          if (isGlobalAdmin) {
            var delBtn = document.createElement('button');
            delBtn.className = 'admin-del-btn';
            delBtn.textContent = '[Удалить эту котокартинку]';
            delBtn.onclick = function() {
              if (confirm('Удалить этот мем из Supabase?')) {
                deletePost(post.id);
              }
            };
            postDiv.appendChild(delBtn);
          }

          postDiv.appendChild(document.createElement('br'));
          var hr = document.createElement('hr');
          hr.setAttribute('align', 'left'); hr.setAttribute('width', '750');
          postDiv.appendChild(hr);

          container.appendChild(postDiv);
        });
      })
      .catch(function() {
        container.innerHTML = '<font color="red">Ошибка загрузки ленты облака.</font>';
      });
    }

    function deletePost(postId) {
      fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts?id=eq.' + postId, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      })
      .then(function() { alert('Удалено!'); renderDynamicFeed(); });
    }

    publishBtn.onclick = function(e) {
      if (e) e.preventDefault(); // Защита от обрыва сетевого fetch браузером

      // Дополнительная скрытая страховка от взлома формы гостями
      if (!currentUser || !currentUserId) {
        alert('Ошибка: Публикация доступна только зарегистрированным участникам!');
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Выберите файл!'); return;
      }
      if (textInput.value.trim() === '') {
        alert('Введите текст!'); return;
      }

      publishBtn.disabled = true;
      publishBtn.innerText = 'ОТПРАВКА...';

      var file = fileInput.files[0];
      var reader = new FileReader();

      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var MAX_WIDTH = 700;
          var width = img.width; var height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width; canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.60);
          var dateObj = new Date();
          var formattedDate = String(dateObj.getDate()).padStart(2, '0') + '.' + String(dateObj.getMonth() + 1).padStart(2, '0') + '.' + dateObj.getFullYear();

          // Формируем строгую подпись с ником авторизованного юзера
          var templateTitle = 'Автор: ' + currentUser + roleTag + ', ' + textInput.value.trim() + '... ' + formattedDate;

          fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts', {
            method: 'POST',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': 'Bearer ' + SUPABASE_KEY, 
              'Content-Type': 'application/json', 
              'Prefer': 'return=minimal' 
            },
            body: JSON.stringify({ text: templateTitle, image: compressedBase64 })
          })
          .then(function() {
            alert('Опубликовано на весь мир!');
            textInput.value = ''; fileInput.value = '';
            publishBtn.disabled = false; publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
            renderDynamicFeed();
          })
          .catch(function() {
            // Резервный перехват на случай задержки шлюза Vercel
            textInput.value = ''; fileInput.value = '';
            publishBtn.disabled = false; publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
            setTimeout(renderDynamicFeed, 1000);
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    renderDynamicFeed();
  </script>
</body>
</html>
