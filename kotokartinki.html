<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОкАРТИНКА: просмотр</title>
  <style>
    body { font-family: arial; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #fff2e3; color: #333; }
    img { display: block; margin: 20px 0; }
    .admin-del-btn { background: #ff0000; color: #fff; border: 1px solid #000; font-family: arial; font-size: 11px; font-weight: bold; cursor: pointer; padding: 2px 5px; margin-top: 5px; }
  </style>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">

  <a href="/index.html">На главную</a> | <a href="/editor.html">Создать котокартинку</a><br><br>

  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td bgcolor="#ff9900" colspan="2"><font face="arial" size="3" color="#ffffff"><b>Добавить котокартинку в список</b></font></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Автор:</font></td>
      <td><input type="text" id="manual-author" size="30" value="Аноним"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Текст с картинки:</font></td>
      <td><input type="text" id="manual-text" size="60" placeholder="Введите все надписи, которые есть на картинке"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Выбрать файл:</font></td>
      <td><input type="file" id="manual-file" accept="image/*"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="manual-publish-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ДОБАВИТЬ В СПИСОК!
        </button>
      </td>
    </tr>
  </table>

  <br><br>
  <div id="dynamic-posts-container"></div>
  <div id="static-posts"></div>

  <br> СДЕЛАНО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год

  <script>
    var container = document.getElementById('dynamic-posts-container');
    var fileInput = document.getElementById('manual-file');
    var authorInput = document.getElementById('manual-author');
    var textInput = document.getElementById('manual-text');
    var publishBtn = document.getElementById('manual-publish-btn');

    function renderDynamicFeed() {
      container.innerHTML = '<font face="arial" size="2">Загрузка ленты...</font>';
      
      // Запрашиваем через свой сервер на Vercel
      fetch('/api?type=get_feed')
      .then(function(res) { return res.json(); })
      .then(function(posts) {
        container.innerHTML = '';
        if (!posts || posts.length === 0) {
          container.innerHTML = '<b>Пока нет глобальных котокартинок. Будь первым!</b>';
          return;
        }
        posts.forEach(function(post) {
          var postDiv = document.createElement('div');
          postDiv.style.marginBottom = '40px';

          var titleNode = document.createElement('div');
          var boldNode = document.createElement('b');
          boldNode.textContent = post.text; 
          titleNode.appendChild(boldNode);
          
          var imgNode = document.createElement('img');
          imgNode.src = post.image;
          imgNode.style.maxWidth = '750px'; 
          imgNode.style.height = 'auto'; 
          imgNode.style.border = '1px solid #000';

          postDiv.appendChild(titleNode);
          postDiv.appendChild(imgNode);

          var currentAuthor = authorInput.value.trim().toLowerCase();
          if (currentAuthor === 'richisoft' || currentAuthor === 'тестер') {
            var delBtn = document.createElement('button');
            delBtn.className = 'admin-del-btn';
            delBtn.textContent = '[Удалить эту котокартинку]';
            delBtn.onclick = function() {
              if (confirm('Удалить мем?')) deletePost(post.id);
            };
            postDiv.appendChild(delBtn);
          }

          postDiv.appendChild(document.createElement('br'));
          var hr = document.createElement('hr');
          hr.setAttribute('align', 'left'); hr.setAttribute('width', '750');
          postDiv.appendChild(hr);
          container.appendChild(postDiv);
        });
      })
      .catch(function(err) {
        container.innerHTML = '<font color="red">Ошибка сети: ' + err.message + '</font>';
      });
    }

    function deletePost(postId) {
      fetch('/api?type=delete_post&id=' + postId, { method: 'POST' })
      .then(function() { alert('Удалено!'); renderDynamicFeed(); });
    }

    publishBtn.onclick = function(e) {
      if (e) e.preventDefault();
      if (!fileInput.files || fileInput.files.length === 0 || textInput.value.trim() === '') {
        alert('Заполните все поля!'); return;
      }

      publishBtn.disabled = true;
      publishBtn.innerText = 'ОТПРАВКА...';

      var reader = new FileReader();
      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          
          var MAX_WIDTH = 500;
          var width = img.width; var height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width; canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.50);
          var dateObj = new Date();
          var formattedDate = String(dateObj.getDate()).padStart(2, '0') + '.' + String(dateObj.getMonth() + 1).padStart(2, '0') + '.' + dateObj.getFullYear();
          var authorName = authorInput.value.trim() || 'Аноним';
          var templateTitle = 'Автор: ' + authorName + ', ' + textInput.value.trim() + '... ' + formattedDate;

          fetch('/api?type=add_post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: templateTitle, image: compressedBase64 })
          })
          .then(function() {
            alert('Опубликовано!');
            textInput.value = ''; fileInput.value = '';
            publishBtn.disabled = false; publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
            renderDynamicFeed();
          })
          .catch(function() {
            alert('Сбой шлюза.');
            publishBtn.disabled = false; publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(fileInput.files[0]);
    };

    authorInput.oninput = function() { renderDynamicFeed(); };
    renderDynamicFeed();
  </script>
</body>
</html>
