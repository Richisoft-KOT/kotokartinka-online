<script>
    var container = document.getElementById('dynamic-posts-container');
    var fileInput = document.getElementById('manual-file');
    var textInput = document.getElementById('manual-text');
    var publishBtn = document.getElementById('manual-publish-btn');
    var authorLabel = document.getElementById('author-label');
    
    var guestAlertBlock = document.getElementById('guest-alert-block');
    var uploadFormTable = document.getElementById('upload-form-table');

    var SUPABASE_URL = 'https://supabase.co';
    var SUPABASE_KEY = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77'; 

    var currentUser = localStorage.getItem('koto_current_user');
    var currentUserId = parseInt(localStorage.getItem('koto_current_id')) || 0;

    // Проверка авторизации аккаунта
    if (currentUser && currentUserId) {
      uploadFormTable.style.display = 'table';
      var roleTag = '';
      if (currentUserId === 1) roleTag = ' [создатель]';
      if (currentUserId === 2) roleTag = ' [тест]';
      authorLabel.innerText = currentUser + roleTag;
    } else {
      guestAlertBlock.style.display = 'block';
    }

    var isGlobalAdmin = (currentUserId === 1 || currentUserId === 2);

    function renderDynamicFeed() {
      container.innerHTML = '<font face="arial" size="2">Загрузка ленты...</font>';
      
      // ИСПРАВЛЕНО ЖЕСТКО: Запрашиваем только конкретные текстовые колонки id, text и image вместо *
      fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts?select=id,text,image&order=id.desc', {
        method: 'GET',
        headers: { 
          'apikey': SUPABASE_KEY, 
          'Authorization': 'Bearer ' + SUPABASE_KEY, 
          'Content-Type': 'application/json; charset=utf-8' 
        }
      })
      .then(function(res) { 
        if (!res.ok) throw new Error('Ошибка сервера: ' + res.status);
        return res.json(); 
      })
      .then(function(posts) {
        container.innerHTML = '';
        if (!posts || posts.length === 0) {
          container.innerHTML = '<font face="arial" size="3">Пока нет ни одной глобальной котокартинки. Будь первым!</font>';
          return;
        }

        posts.forEach(function(post) {
          var postDiv = document.createElement('div');
          postDiv.style.marginBottom = '40px';

          var titleNode = document.createElement('div');
          var boldNode = document.createElement('b');
          boldNode.textContent = post.text; 
          titleNode.appendChild(boldNode);
          
          var imgNode = document.createElement('img');
          imgNode.src = post.image;
          imgNode.style.maxWidth = '750px'; 
          imgNode.style.height = 'auto'; 
          imgNode.style.border = '1px solid #000';

          postDiv.appendChild(titleNode);
          postDiv.appendChild(imgNode);

          if (isGlobalAdmin) {
            var delBtn = document.createElement('button');
            delBtn.className = 'admin-del-btn';
            delBtn.textContent = '[Удалить эту котокартинку]';
            delBtn.onclick = function() {
              if (confirm('Удалить этот мем из Supabase?')) {
                deletePost(post.id);
              }
            };
            postDiv.appendChild(delBtn);
          }

          postDiv.appendChild(document.createElement('br'));
          var hr = document.createElement('hr');
          hr.setAttribute('align', 'left'); hr.setAttribute('width', '750');
          postDiv.appendChild(hr);

          container.appendChild(postDiv);
        });
      })
      .catch(function(err) {
        container.innerHTML = '<font color="red">Ошибка загрузки ленты облака: ' + err.message + '. Убедитесь, что RLS отключен.</font>';
      });
    }

    function deletePost(postId) {
      fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts?id=eq.' + postId, {
        method: 'DELETE',
        headers: { 
          'apikey': SUPABASE_KEY, 
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json; charset=utf-8'
        }
      })
      .then(function(res) {
        if (!res.ok) throw new Error('Код: ' + res.status);
        alert('Удалено!'); 
        renderDynamicFeed(); 
      })
      .catch(function(err) {
        alert('Ошибка удаления: ' + err.message);
      });
    }

    publishBtn.onclick = function(e) {
      if (e) e.preventDefault(); 

      if (!currentUser || !currentUserId) {
        alert('Ошибка: Публикация доступна только зарегистрированным участникам!');
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Выберите файл!'); return;
      }
      if (textInput.value.trim() === '') {
        alert('Введите текст!'); return;
      }

      publishBtn.disabled = true;
      publishBtn.innerText = 'ОТПРАВКА...';

      var file = fileInput.files[0];
      var reader = new FileReader();

      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var MAX_WIDTH = 700;
          var width = img.width; var height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width; canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.55);
          var dateObj = new Date();
          var formattedDate = String(dateObj.getDate()).padStart(2, '0') + '.' + String(dateObj.getMonth() + 1).padStart(2, '0') + '.' + dateObj.getFullYear();

          var templateTitle = 'Автор: ' + currentUser + roleTag + ', ' + textInput.value.trim() + '... ' + formattedDate;

          fetch(SUPABASE_URL + '/rest/v1/kotokartinka_posts', {
            method: 'POST',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': 'Bearer ' + SUPABASE_KEY, 
              'Content-Type': 'application/json; charset=utf-8', 
              'Prefer': 'return=minimal' 
            },
            body: JSON.stringify({ text: templateTitle, image: compressedBase64 })
          })
          .then(function(res) {
            if (!res.ok) throw new Error('Код сервера: ' + res.status);
            alert('Опубликовано на весь мир!');
            textInput.value = ''; fileInput.value = '';
            publishBtn.disabled = false; publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
            renderDynamicFeed();
          })
          .catch(function(err) {
            alert('Ошибка публикации: ' + err.message);
            textInput.value = ''; fileInput.value = '';
            publishBtn.disabled = false; publishBtn.innerText = 'ДОБАВИТЬ В СПИСОК!';
            setTimeout(renderDynamicFeed, 1000);
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    renderDynamicFeed();
</script>
