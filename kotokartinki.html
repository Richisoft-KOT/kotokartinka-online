<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: просмотр</title>
  <style>
    body {
      font-family: arial;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #fff2e3;
      color: #333
    }
    img {
      display: block;
      margin: 20px 0;
    }
    .admin-del-btn {
      background: #ff0000; color: #fff; border: 1px solid #000;
      font-family: arial; font-size: 11px; font-weight: bold;
      cursor: pointer; padding: 2px 5px; margin-top: 5px;
    }
  </style>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">

<a href="/index.html">На главную</a> | <a href="/editor.html">Создать котокартинку</a><br><br>

  <!-- Форма загрузки в олдскульном стиле таблиц -->
  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td bgcolor="#ff9900" colspan="2"><font face="arial" size="3" color="#ffffff"><b>Добавить котокартинку в список</b></font></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Ваш Логин:</font></td>
      <td>
        <input type="text" id="manual-author" size="30" value="Аноним">
      </td>
    </tr>
    <tr id="password-row" style="display: none;">
      <td align="right"><font color="red" face="arial" size="2">Пароль доступа:</font></td>
      <td>
        <input type="password" id="admin-password-input" size="30">
        <font size="1" color="red">* вход в спец-аккаунт</font>
      </td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Текст с картинки:</font></td>
      <td><input type="text" id="manual-text" size="60" placeholder="Введите все надписи, которые есть на картинке"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Выбрать файл:</font></td>
      <td><input type="file" id="manual-file" accept="image/*"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="manual-publish-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ДОБАВИТЬ В СПИСОК!
        </button>
      </td>
    </tr>
  </table>

  <br><br>

  <div id="dynamic-posts-container"></div>
  <div id="static-posts"></div>

<br>
СДЕЛАНО МЕМОМ РИЧАРДСОМ/РИЧИСОФТОМ 2026 год

  <script>
    var container = document.getElementById('dynamic-posts-container');
    var fileInput = document.getElementById('manual-file');
    var authorInput = document.getElementById('manual-author');
    var passwordRow = document.getElementById('password-row');
    var passwordInput = document.getElementById('admin-password-input');
    var textInput = document.getElementById('manual-text');
    var publishBtn = document.getElementById('manual-publish-btn');

    // СЕКРЕТНЫЕ ПАРОЛИ ДЛЯ ЗАЩИТЫ АДМИНИСТРАЦИИ (можно поменять на свои)
    var PASS_CREATOR = 'richi2026';
    var PASS_TESTER = 'test2026';

    if (localStorage.getItem('koto_last_nickname')) {
      authorInput.value = localStorage.getItem('koto_last_nickname');
    }

    // Следим за вводом логина, чтобы вовремя включить проверку пароля
    function checkLoginStatus() {
      var login = authorInput.value.trim().toLowerCase();
      if (login === 'richisoft' || login === 'тестер') {
        passwordRow.style.display = 'table-row';
      } else {
        passwordRow.style.display = 'none';
      }
    }

    function renderDynamicFeed() {
      container.innerHTML = '';
      var posts = [];
      try {
        posts = JSON.parse(localStorage.getItem('kotomatrix_posts') || '[]');
      } catch(e) {
        posts = [];
      }

      var currentLogin = authorInput.value.trim().toLowerCase();
      var currentPass = passwordInput.value.trim();

      // Права администратора включаются только если введен правильный пароль!
      var isCreator = (currentLogin === 'richisoft' && currentPass === PASS_CREATOR);
      var isTester = (currentLogin === 'тестер' && currentPass === PASS_TESTER);
      var isGlobalAdmin = (isCreator || isTester);

      posts.forEach(function(post, idx) {
        var postDiv = document.createElement('div');
        postDiv.style.marginBottom = '40px';

        var titleNode = document.createElement('div');
        var boldNode = document.createElement('b');
        boldNode.textContent = post.title; 
        titleNode.appendChild(boldNode);
        
        var imgNode = document.createElement('img');
        imgNode.src = post.image;
        imgNode.style.maxWidth = '750px';
        imgNode.style.height = 'auto';
        imgNode.style.border = '1px solid #000';

        postDiv.appendChild(titleNode);
        postDiv.appendChild(imgNode);

        if (isGlobalAdmin) {
          var delBtn = document.createElement('button');
          delBtn.className = 'admin-del-btn';
          delBtn.textContent = '[Удалить эту котокартинку]';
          delBtn.onclick = function() {
            if (confirm('Удалить эту котокартинку из ленты?')) {
              posts.splice(idx, 1);
              localStorage.setItem('kotomatrix_posts', JSON.stringify(posts));
              renderDynamicFeed();
            }
          };
          postDiv.appendChild(delBtn);
        }

        postDiv.appendChild(document.createElement('br'));
        var hr = document.createElement('hr');
        hr.setAttribute('align', 'left'); hr.setAttribute('width', '750');
        postDiv.appendChild(hr);

        container.appendChild(postDiv);
      });
    }

    authorInput.oninput = function() {
      checkLoginStatus();
      renderDynamicFeed();
    };
    passwordInput.oninput = renderDynamicFeed;

    publishBtn.onclick = function(e) {
      if (e) e.preventDefault();

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Сначала выберите файл картинки!');
        return;
      }

      var nickname = authorInput.value.trim();
      var userText = textInput.value.trim();
      var pass = passwordInput.value.trim();

      if (nickname === '' || userText === '') {
        alert('Заполните логин и текст!');
        return;
      }

      // ЖЕСТКАЯ ЗАЩИТА: Проверяем подлинность Создателя и Тестера перед отправкой
      if (nickname.toLowerCase() === 'richisoft' && pass !== PASS_CREATOR) {
        alert('Ошибка: Неверный пароль доступа для аккаунта Richisoft!');
        return;
      }
      if (nickname.toLowerCase() === 'тестер' && pass !== PASS_TESTER) {
        alert('Ошибка: Неверный пароль доступа для аккаунта Тестер!');
        return;
      }

      localStorage.setItem('koto_last_nickname', nickname);

      var file = fileInput.files[0];
      var reader = new FileReader();

      reader.onload = function(event) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');

          var MAX_WIDTH = 800;
          var width = img.width;
          var height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);

          var dateObj = new Date();
          var formattedDate = String(dateObj.getDate()).padStart(2, '0') + '.' + String(dateObj.getMonth() + 1).padStart(2, '0') + '.' + dateObj.getFullYear();

          var displayNickname = nickname;
          if (nickname.toLowerCase() === 'richisoft') {
            displayNickname = 'Richisoft [создатель]';
          } else if (nickname.toLowerCase() === 'тестер') {
            displayNickname = 'Тестер [тест]';
          }

          var templateTitle = 'Автор: ' + displayNickname + ', ' + userText + '... ' + formattedDate;

          var newPost = { image: compressedBase64, title: templateTitle };
          var currentPosts = [];
          try {
            currentPosts = JSON.parse(localStorage.getItem('kotomatrix_posts') || '[]');
          } catch(e) {
            currentPosts = [];
          }
          
          currentPosts.unshift(newPost);
          
          try {
            localStorage.setItem('kotomatrix_posts', JSON.stringify(currentPosts));
          } catch(e) {
            alert('Хранилище переполнено!');
            return;
          }

          textInput.value = '';
          fileInput.value = '';
          passwordInput.value = '';
          
          checkLoginStatus();
          renderDynamicFeed();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    checkLoginStatus();
    renderDynamicFeed();
  </script>
</body>
</html>
