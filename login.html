<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: Вход</title>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">
  <a href="/index.html">На главную</a><br><br>
  <font face="arial" size="5"><b>ВХОД НА САЙТ</b></font><br><br>
  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr><td>Логин:</td><td><input type="text" id="u" size="30"></td></tr>
    <tr><td>Пароль:</td><td><input type="password" id="p" size="30"></td></tr>
    <tr><td colspan="2" align="center"><button id="btn">ВОЙТИ!</button></td></tr>
  </table>
  <br><a href="/register.html">Зарегистрироваться</a>

  <script>
    document.getElementById('btn').onclick = function(e) {
      if (e) e.preventDefault();
      var user = document.getElementById('u').value.trim(), pass = document.getElementById('p').value.trim();
      if (user === '' || pass === '') { alert('Заполните поля!'); return; }

      fetch('/api?type=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: user, pass: pass })
      })
      .then(function(res) { return res.json(); })
      .then(function(resData) {
        if (resData.status === 'invalid') { alert('Неверный логин или пароль!'); return; }
        localStorage.setItem('koto_current_user', resData.username);
        localStorage.setItem('koto_current_id', resData.id);
        alert('Вы вошли!'); window.location.href = 'profile.html';
      }).catch(function() { alert('Ошибка сервера!'); });
    };

  </script>
</body>
</html>
