<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РЕДАКТОР КОТОКАРТИНКИ</title>
  <style>
    body {
      font-family: arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background-color: #fff2e3;
      color: #333;
      text-align: center;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #d35400;
      text-decoration: none;
      font-weight: bold;
    }
    .editor-box {
      background: #fbe5cb;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .input-field {
      width: 100%;
      height: 70px;
      padding: 10px;
      font-size: 18px;
      border: 2px solid #d35400;
      border-radius: 6px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 15px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #d35400;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #a04000;
    }
    .btn-upload {
      background-color: #2e7d32;
    }
    .btn-upload:hover {
      background-color: #1b5e20;
    }
    /* Скрытый стандартный инпут для файла */
    #fileInput {
      display: none;
    }
    /* Контейнер с холстом */
    .canvas-container {
      margin-top: 20px;
      max-width: 100%;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background: #ccc;
    }
  </style>
</head>
<body>

  <a href="/" class="back-link">&larr; Вернуться на главную</a>
  
  <h1>КОТОКАРТИНКА РЕДАКТОР</h1>
  <p>Введи текст, загрузи фото своего кота и скачай готовую котоматрицу!</p>

  <div class="editor-box">
    <!-- Поле ввода текста -->
    <textarea id="memeText" class="input-field" placeholder="Напиши что-нибудь смешное..."></textarea>
    
    <!-- Кнопки управления -->
    <label for="fileInput" class="btn btn-upload">Загрузить своего кота</label>
    <input type="file" id="fileInput" accept="image/*">
    
    <button id="downloadBtn" class="btn">Скачать результат</button>
    
    <!-- Область генерации -->
    <div class="canvas-container">
      <canvas id="memeCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    const memeText = document.getElementById('memeText');
    const fileInput = document.getElementById('fileInput');
    const downloadBtn = document.getElementById('downloadBtn');

    // Картинка по умолчанию (кот-фотограф из вашего кода)
    let img = new Image();
    img.crossOrigin = "anonymous"; 
    img.src = "https://github.com";

    img.onload = function() {
      resetCanvas();
    };

    // Загрузка своего файла
    fileInput.addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        img = new Image();
        img.onload = function() {
          resetCanvas();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    // Функция обновления холста
    function resetCanvas() {
      canvas.width = img.width;
      canvas.height = img.height;
      drawMeme();
    }

    function drawMeme() {
      // Рисуем кота
      ctx.drawImage(img, 0, 0);

      // Настройки шрифта Котоматрицы (Белый Impact с черной обводкой)
      const fontSize = Math.floor(canvas.width * 0.05); // Размер адаптивен под картинку
      ctx.font = `bold ${fontSize}px Impact, Arial, sans-serif`;
      ctx.fillStyle = 'white';
      ctx.strokeStyle = 'black';
      ctx.lineWidth = fontSize * 0.15;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      // Разбираем строки текста
      const text = memeText.value;
      const lines = text.split('\n');
      const lineHeight = fontSize * 1.2;
      
      // Рисуем текст в левом верхнем углу (отступ 20px)
      lines.forEach((line, index) => {
        let x = canvas.width / 2; // По центру
        let y = 20 + (index * lineHeight);
        
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    }

    // Слушаем ввод текста
    memeText.addEventListener('input', drawMeme);

    // Кнопка скачивания
    downloadBtn.addEventListener('click', function() {
      const link = document.createElement('a');
      link.download = 'kotokartinka.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  </script>

</body>
</html>
