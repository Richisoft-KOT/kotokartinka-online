<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: Регистрация</title>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">
  <a href="/index.html">На главную</a><br><br>
  <font face="arial" size="5"><b>РЕГИСТРАЦИЯ</b></font><br><br>
  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr><td>Логин:</td><td><input type="text" id="u" size="30"></td></tr>
    <tr id="k-row" style="display:none;"><td><font color="red">Мастер-ключ:</font></td><td><input type="password" id="k" size="30"></td></tr>
    <tr><td>Пароль:</td><td><input type="password" id="p" size="30"></td></tr>
    <tr><td colspan="2" align="center"><button id="btn">ЗАРЕГИСТРИРОВАТЬСЯ!</button></td></tr>
  </table>
  <br><a href="/login.html">Войти здесь</a>

  <script>
    var uInp=document.getElementById('u'), kInp=document.getElementById('k'), pInp=document.getElementById('p');
    var kRow=document.getElementById('k-row'), btn=document.getElementById('btn');

    uInp.oninput = function() {
      var v = uInp.value.trim().toLowerCase();
      kRow.style.display = (v === 'richisoft' || v === 'тестер') ? 'table-row' : 'none';
    };

    btn.onclick = function(e) {
      if(e) e.preventDefault();
      var user = uInp.value.trim(), pass = pInp.value.trim(), key = kInp.value.trim().toLowerCase();
      if(user === '' || pass === '') { alert('Заполните поля!'); return; }

      // ЖЕСТКАЯ ЗАЩИТА: проверка секретного мастер-кода на клиенте
      if(user.toLowerCase() === 'richisoft' && key !== 'richi2020') { alert('Неверный мастер-ключ!'); return; }
      if(user.toLowerCase() === 'тестер' && key !== 'test2026') { alert('Неверный мастер-ключ!'); return; }

      var users = JSON.parse(localStorage.getItem('koto_users_db') || '[]');
      if(users.some(function(x){ return x.u.toLowerCase() === user.toLowerCase(); })) { alert('Логин занят!'); return; }

      var newId = users.length + 3; // Обычные юзеры получают ID начиная с 3
      if(user.toLowerCase() === 'richisoft') newId = 1;
      if(user.toLowerCase() === 'тестер') newId = 2;

      users.push({ id: newId, u: user, p: pass });
      localStorage.setItem('koto_users_db', JSON.stringify(users));
      alert('Регистрация успешна!'); window.location.href = '/login.html';
    };
  </script>
</body>
</html>
