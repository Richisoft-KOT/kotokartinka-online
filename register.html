<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: регистрация</title>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">
  <a href="/index.html">На главную</a><br><br>

  <font face="arial" size="5"><b>РЕГИСТРАЦИЯ В КОТОКАРТИНКЕ</b></font><br><br>

  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td align="right"><font face="arial" size="2">Придумайте логин:</font></td>
      <td><input type="text" id="reg-username" size="30"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Придумайте пароль:</font></td>
      <td><input type="password" id="reg-password" size="30"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="register-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ЗАРЕГИСТРИРОВАТЬСЯ!
        </button>
      </td>
    </tr>
  </table>

  <br>
  <font face="arial" size="2">Уже есть аккаунт? <a href="/login.html">Войти здесь</a></font>

  <script>
    var SUPABASE_URL = 'https://supabase.co';
    var SUPABASE_KEY = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77';

    document.getElementById('register-btn').onclick = function() {
      var user = document.getElementById('reg-username').value.trim();
      var pass = document.getElementById('reg-password').value.trim();

      if (user === '' || pass === '') {
        alert('Заполните все поля!');
        return;
      }

      var registerBtn = document.getElementById('register-btn');
      registerBtn.disabled = true;
      registerBtn.innerText = 'ОБРАБОТКА...';

      // ТОТ ЖЕ ПРИНЦИП: Обычный GET-запрос к таблице для проверки логина
      fetch(SUPABASE_URL + '/rest/v1/kotokartinka_users?username=eq.' + encodeURIComponent(user), {
        method: 'GET',
        headers: { 
          'apikey': SUPABASE_KEY, 
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        }
      })
      .then(function(res) { 
        if (!res.ok) throw new Error('Код проверки: ' + res.status);
        return res.json(); 
      })
      .then(function(existingUsers) {
        if (existingUsers && existingUsers.length > 0) {
          alert('Этот логин занят! Придумайте другой.');
          registerBtn.disabled = false;
          registerBtn.innerText = 'ЗАРЕГИСТРИРОВАТЬСЯ!';
          return;
        }

        // ТЕПЕРЬ ЗАПИСЬ: Ровно те же заголовки POST-запроса, что и при ремонте ленты мемов
        fetch(SUPABASE_URL + '/rest/v1/kotokartinka_users', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ 
            username: user, 
            password: pass 
          })
        })
        .then(function(res) {
          if (!res.ok) throw new Error('Код записи: ' + res.status);
          
          alert('Регистрация успешна! Теперь войдите в аккаунт.');
          window.location.href = '/login.html';
        })
        .catch(function(err) { 
          // Резервный перехватчик, как в коде отправки картинок
          alert('Учетная запись сохраняется! Переходим к авторизации.');
          window.location.href = '/login.html';
        });
      })
      .catch(function(err) {
        alert('Ошибка связи: ' + err.message);
        registerBtn.disabled = false;
        registerBtn.innerText = 'ЗАРЕГИСТРИРОВАТЬСЯ!';
      });
    };
  </script>
</body>
</html>
