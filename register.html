<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="windows-1251">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КОТОКАРТИНКА: Регистрация</title>
</head>
<body bgcolor="#fff2e3" text="#333333" link="#0000ee" vlink="#551a8b">
  <a href="/index.html">На главную</a><br><br>

  <font face="arial" size="5"><b>РЕГИСТРАЦИЯ В КОТОКАРТИНКЕ</b></font><br><br>

  <table border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td align="right"><font face="arial" size="2">Придумайте логин:</font></td>
      <td><input type="text" id="reg-username" size="30"></td>
    </tr>
    <tr id="secret-key-row" style="display: none;">
      <td align="right"><font color="red" face="arial" size="2">Секретный мастер-ключ:</font></td>
      <td><input type="password" id="reg-key" size="30"></td>
    </tr>
    <tr>
      <td align="right"><font face="arial" size="2">Придумайте пароль:</font></td>
      <td><input type="password" id="reg-password" size="30"></td>
    </tr>
    <tr>
      <td colspan="2" align="center">
        <button id="register-btn" style="font-family: arial; font-size: 14px; font-weight: bold; padding: 4px 10px;">
          ЗАРЕГИСТРИРОВАТЬСЯ!
        </button>
      </td>
    </tr>
  </table>

  <br>
  <font face="arial" size="2">Уже есть аккаунт? <a href="/login.html">Войти здесь</a></font>

  <script>
    var SUPABASE_URL = 'https://supabase.co';
    var SUPABASE_KEY = 'sb_publishable_1Zxs_9yRDVRr1DTfyck8WA_v8VUst77';

    var usernameInput = document.getElementById('reg-username');
    var keyRow = document.getElementById('secret-key-row');

    usernameInput.oninput = function() {
      var val = usernameInput.value.trim().toLowerCase();
      if (val === 'richisoft' || val === 'тестер') {
        keyRow.style.display = 'table-row';
      } else {
        keyRow.style.display = 'none';
      }
    };

    document.getElementById('register-btn').onclick = function(e) {
      if (e) e.preventDefault();

      var user = usernameInput.value.trim();
      var pass = document.getElementById('reg-password').value.trim();
      var key = document.getElementById('reg-key').value.trim();

      if (user === '' || pass === '') {
        alert('Заполните все поля!');
        return;
      }

      fetch(SUPABASE_URL + '/rest/v1/rpc/secure_register', {
        method: 'POST',
        headers: { 
          'apikey': SUPABASE_KEY, 
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ user_param: user, pass_param: pass, key_param: key })
      })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result === 'wrong_key') {
          alert('Критическая ошибка: Доступ запрещен. Неверный мастер-ключ создателя!');
        } else if (result === 'occupied') {
          alert('Этот логин занят!');
        } else if (result === 'success') {
          alert('Регистрация успешна!');
          window.location.href = '/login.html';
        }
      })
      .catch(function() {
        alert('Ошибка сети! Без проверки сервера регистрация отклонена.');
      });
    };
  </script>
</body>
</html>
